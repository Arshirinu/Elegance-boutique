    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#0b090c;
            color:#f4efe9;
            padding-top:90px;
        }

        nav{
            position:fixed;
            top:0;
            width:100%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 40px;
            background:rgba(11,9,12,.85);
            backdrop-filter:blur(20px);
            border-bottom:1px solid rgba(212,163,115,.15);
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:12px;
        }

        nav ul li a{
            text-decoration:none;
            color:#f4efe9;
            padding:10px 15px;
            border-radius:30px;
            transition:.3s;
        }

        nav ul li a:hover{
            background:#d4a373;
            color:#111;
        }

        .sign{
            border:1px solid #d4a373;
            background:transparent;
            color:#d4a373;
            padding:10px 22px;
            border-radius:30px;
        }

        .container{
            width:90%;
            max-width:500px;
            margin:50px auto;
            background:#161216;
            padding:40px;
            border-radius:20px;
            border:1px solid rgba(212,163,115,.15);
            box-shadow:0 15px 40px rgba(0,0,0,.4);
        }

        h1{
            text-align:center;
            color:#d4a373;
            margin-bottom:30px;
        }

        .input-box{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            color:#d4a373;
        }

        input{
            width:100%;
            padding:14px;
            border:none;
            outline:none;
            border-radius:10px;
            background:#242024;
            color:white;
        }

        input:focus{
            border:1px solid #d4a373;
        }

        .register-btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:30px;
            background:#d4a373;
            color:#111;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        .register-btn:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 25px rgba(212,163,115,.4);
        }

        p{
            text-align:center;
            margin-top:20px;
        }

        p a{
            color:#d4a373;
            text-decoration:none;
        }

        footer{
            text-align:center;
            padding:30px;
            margin-top:60px;
            border-top:1px solid rgba(212,163,115,.15);
            color:#999;
        }
    </style>
</head>

<div class="container">

<h1>Create Your Account</h1>

<form>

<div class="input-box">
<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>
</div>

<div class="input-box">
<label>Email Address</label>
<input type="email" placeholder="Enter your email" required>
</div>

<div class="input-box">
<label>Phone Number</label>
<input type="tel" placeholder="Enter your phone number" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" placeholder="Create a password" required>
</div>

<div class="input-box">
<label>Confirm Password</label>
<input type="password" placeholder="Confirm your password" required>
</div>

<button class="register-btn" type="submit">
Register Now
</button>

</form>

<p>Already have an account?
<a href="#">Sign In</a>
</p>

</div>

<footer>
© 2026 Elegance Boutique | Luxury Fashion Boutique
</footer>

</body>
